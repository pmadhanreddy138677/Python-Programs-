{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}circliq — Find Your Circle{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <script nonce="{{ csp_nonce }}">
    (function () {
      var t = null; try { t = localStorage.getItem('circliq-theme'); } catch (e) {}
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="min-h-screen antialiased" data-auth="{% if user.is_authenticated %}1{% endif %}">
  <a href="#main" class="skip-link">Skip to content</a>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><defs><linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4F46E5"/><stop offset="1" stop-color="#0891B2"/></linearGradient></defs></svg>
  {% if messages %}
  <div class="fixed top-4 right-4 z-50 flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2" role="status">
    {% for m in messages %}<div class="toast {{ m.tags }}">{{ m }}</div>{% endfor %}
  </div>
  {% endif %}
  {% block body %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
  {% if user.is_authenticated %}<script src="{% static 'js/live.js' %}"></script>{% endif %}
</body>
</html>
