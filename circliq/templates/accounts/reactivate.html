{% extends "accounts/auth_base.html" %}
{% block title %}Reactivate · circliq{% endblock %}
{% block form_area %}
<h2 class="text-3xl font-bold">Reactivate your account</h2><p class="mt-1 muted">Deactivated it earlier? Enter your details to switch it back on.</p>
<form method="post" class="mt-6 space-y-4">{% csrf_token %}
  <div><label class="label" for="re-email">Email</label><input id="re-email" type="email" name="email" required autocomplete="email"></div>
  <div><label class="label" for="re-pw">Password</label><input id="re-pw" type="password" name="password" required autocomplete="current-password"></div>
  <button class="btn btn-primary w-full !py-3">Reactivate</button></form>
<p class="mt-4 text-sm muted"><a class="font-semibold" style="color:var(--primary)" href="{% url 'accounts:login' %}">Back to login</a></p>
{% endblock %}
