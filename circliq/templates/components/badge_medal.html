<div class="flex items-center gap-3" title="{{ b.rule }}"><span class="medal {{ b.tile }} {% if b.earned %}earned{% else %}locked{% endif %}">{% include "components/icon.html" with name=b.icon %}</span>
  <div class="min-w-0 flex-1"><p class="text-sm font-bold">{{ b.name }}</p><p class="text-xs muted">{{ b.rule }}</p>
    {% if not b.earned %}<div class="progress mt-1"><div style="width:{{ b.pct }}%"></div></div><p class="mt-0.5 text-[11px] muted">{{ b.value }} / {{ b.target }}</p>{% else %}<p class="text-[11px] font-semibold" style="color:var(--ok-text)">Earned</p>{% endif %}</div></div>
