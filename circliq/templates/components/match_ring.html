<span class="mring {% if pct >= 70 %}great{% elif pct >= 40 %}good{% else %}look{% endif %}" style="width:{{ size|default:64 }}px;height:{{ size|default:64 }}px" title="Match strength {{ pct }}%">
  <svg viewBox="0 0 40 40" width="{{ size|default:64 }}" height="{{ size|default:64 }}"><circle class="trk" cx="20" cy="20" r="16" fill="none" stroke-width="4.5"/><circle class="bar" cx="20" cy="20" r="16" fill="none" stroke-width="4.5" stroke-dasharray="{% widthratio pct 100 100.53 %} 100.53"/></svg><b>{{ pct }}%</b></span>
