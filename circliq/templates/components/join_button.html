{% if c.state == "member" %}<a href="{% url 'communities:detail' c.pk %}" class="btn btn-secondary !py-2" style="color:var(--ok-text)">✓ Joined</a>
{% elif c.state == "pending" %}<span class="btn btn-ghost !py-2">Requested…</span>
{% else %}<form method="post" action="{% url 'communities:join' c.pk %}">{% csrf_token %}<input type="hidden" name="next_url" value="{{ next }}"><button class="btn btn-primary !py-2">{% if c.is_private %}Request to join{% else %}Join{% endif %}</button></form>{% endif %}
