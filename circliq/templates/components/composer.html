{% comment %}Expects form, optional fixed (community pk), next.{% endcomment %}
<form method="post" action="{% url 'discussions:create' %}" enctype="multipart/form-data" class="card composer p-4" novalidate>
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <div class="flex gap-3">
    {% include "components/avatar.html" with u=user size="h-10 w-10" %}
    <div class="min-w-0 flex-1">
      <input name="title" class="input !border-0 !px-0 !shadow-none text-lg font-semibold" placeholder="Title (required for questions and projects)" maxlength="150" aria-label="Title (required for questions and projects)">
      {{ form.body }}
    </div>
  </div>
  <div class="mt-3 flex flex-wrap items-center gap-2 border-t pt-3" style="border-color:var(--border)">
    {% if fixed %}<input type="hidden" name="community" value="{{ fixed }}">{% else %}<select name="community" class="input !w-auto !py-1.5 text-sm" aria-label="Community">{% for c in form.fields.community.queryset %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}</select>{% endif %}
    <select name="kind" class="input !w-auto !py-1.5 text-sm" aria-label="Post type"><option value="discussion" {% if form.initial.kind == 'discussion' %}selected{% endif %}>Discussion</option><option value="question" {% if form.initial.kind == 'question' %}selected{% endif %}>Question</option><option value="project">Project idea</option></select>
    <input type="file" name="image" accept="image/jpeg,image/png,image/webp" class="input !w-auto !py-1 text-xs" aria-label="Attach image">
    <button class="btn btn-primary ml-auto !py-2">Post</button>
  </div>
</form>
