<div>
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="relative">
    {{ field }}
    {% if field.field.widget.input_type == 'password' %}
    <button type="button" data-toggle-password="{{ field.id_for_label }}" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold muted">Show</button>
    {% endif %}
  </div>
  {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
</div>
