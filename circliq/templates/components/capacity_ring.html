{% comment %}value, max, size (px, default 52){% endcomment %}
<span class="ring {% if value >= max %}full{% endif %}" style="width:{{ size|default:52 }}px;height:{{ size|default:52 }}px" title="{{ value }} of {{ max }} places taken">
  <svg viewBox="0 0 40 40" width="{{ size|default:52 }}" height="{{ size|default:52 }}"><circle class="trk" cx="20" cy="20" r="16" fill="none" stroke-width="5"/>
    <circle class="bar" cx="20" cy="20" r="16" fill="none" stroke-width="5" stroke-dasharray="{% widthratio value max 100.53 %} 100.53"/></svg>
  <span>{{ value }}/{{ max }}</span>
</span>
